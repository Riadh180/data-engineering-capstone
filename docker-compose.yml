# Local-first stack. Step 1: Postgres serving warehouse.
# (Airflow, MinIO, app will be added as later services.)
services:
  postgres:
    image: postgres:16
    container_name: aiwork_postgres
    environment:
      POSTGRES_USER: aiwork
      POSTGRES_PASSWORD: aiwork
      POSTGRES_DB: aiwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwork"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: